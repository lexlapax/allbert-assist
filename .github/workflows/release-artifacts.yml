# v1.3 M9.a2: operator machines compile one complete draft generation.
# GitHub only qualifies exact release-asset IDs, gates promotion, signs, and
# publishes the same bytes. The workflow intentionally has no build job.
name: release-artifacts

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Qualify a draft generation or promote its accepted evidence
        required: true
        type: choice
        options: [qualification, promotion]
      release_id:
        description: Numeric GitHub draft release ID
        required: true
        type: string
      tag:
        description: Intended product tag; dispatch at this provisional tag ref
        required: true
        type: string
      source_sha:
        description: Exact 40-character candidate source SHA
        required: true
        type: string
      candidate_generation:
        description: Complete candidate-generation identifier
        required: true
        type: string
      candidate_manifest_asset_id:
        description: Numeric draft asset ID for candidate-manifest.json
        required: true
        type: string
      candidate_manifest_asset_digest:
        description: Candidate-manifest release-asset SHA-256 without prefix
        required: true
        type: string
      qualification_run_id:
        description: Promotion only; successful qualification workflow run ID
        required: false
        type: string
      qualification_artifact_id:
        description: Promotion only; qualification-manifest Actions artifact ID
        required: false
        type: string
      qualification_artifact_digest:
        description: Promotion only; qualification Actions ZIP SHA-256 without prefix
        required: false
        type: string
      operator_tui_validation:
        description: Promotion only; confirmed after exact macOS TUI attach/status/real turn/health
        required: false
        type: string
      configured_provider_validation:
        description: Promotion only; confirmed after the exact macOS configured-provider turn
        required: false
        type: string

permissions: {}

env:
  RELEASE_WORKFLOW_PATH: .github/workflows/release-artifacts.yml

jobs:
  qualify:
    if: inputs.operation == 'qualification'
    name: qualify-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify exact dispatch and checkout binding
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/tags/${{ inputs.tag }}" ]
          [ "$GITHUB_SHA" = "${{ inputs.source_sha }}" ]
          [ "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}" ]
          [ -z "$(git status --porcelain)" ]
      - name: Qualify exact packaged license and TUI protocol
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release/stage_artifacts.sh qualify-target \
            "${{ matrix.target }}" \
            "${{ inputs.release_id }}" \
            "${{ inputs.candidate_manifest_asset_id }}" \
            "${{ inputs.candidate_manifest_asset_digest }}" \
            "qualification-${{ matrix.target }}.json"
      - name: Upload content-free target qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ github.run_id }}-a${{ github.run_attempt }}-${{ matrix.target }}
          path: qualification-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  qualification-evidence:
    needs: qualify
    if: inputs.operation == 'qualification'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest-sha256: ${{ steps.compose.outputs.qualification-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Compose exact three-target qualification evidence
        id: compose
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release/stage_artifacts.sh collect-qualification \
            "${{ inputs.release_id }}" \
            "${{ inputs.candidate_manifest_asset_id }}" \
            "${{ inputs.candidate_manifest_asset_digest }}" \
            qualification-manifest.json
      - name: Upload content-free qualification manifest
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ github.run_id }}-a${{ github.run_attempt }}-manifest
          path: qualification-manifest.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Record exact promotion inputs
        run: |
          {
            echo "qualification_run_id=${{ github.run_id }}"
            echo "qualification_artifact_id=${{ steps.upload.outputs.artifact-id }}"
            echo "qualification_artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
            echo "qualification_manifest_sha256=${{ steps.compose.outputs.qualification-sha256 }}"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    if: inputs.operation == 'promotion'
    environment: release-promotion
    concurrency:
      group: release-promotion-${{ inputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Load stateless promoter from the exact candidate SHA
        id: promoter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/promote_artifacts.sh"
          gh api "/repos/${GITHUB_REPOSITORY}/contents/scripts/release/promote_artifacts.sh?ref=${SOURCE_SHA}" \
            --jq .content | tr -d '\n' | base64 --decode > "$helper"
          grep -q '^#!/usr/bin/env bash$' "$helper"
          chmod 0500 "$helper"
          echo "path=$helper" >> "$GITHUB_OUTPUT"
      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify exact cosign version
        shell: bash
        run: |
          set -euo pipefail
          resolved_cosign="$(cosign version | awk '$1 == "GitVersion:" {print $2; exit}')"
          [ "$resolved_cosign" = v3.0.6 ]
      - name: Revalidate, sign, and publish the unchanged draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RELEASE_ID: ${{ inputs.release_id }}
          PROMOTION_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_GENERATION: ${{ inputs.candidate_generation }}
          CANDIDATE_MANIFEST_ASSET_ID: ${{ inputs.candidate_manifest_asset_id }}
          CANDIDATE_MANIFEST_ASSET_DIGEST: ${{ inputs.candidate_manifest_asset_digest }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
          QUALIFICATION_ARTIFACT_DIGEST: ${{ inputs.qualification_artifact_digest }}
          OPERATOR_TUI_VALIDATION: ${{ inputs.operator_tui_validation }}
          CONFIGURED_PROVIDER_VALIDATION: ${{ inputs.configured_provider_validation }}
        run: "${{ steps.promoter.outputs.path }}"
